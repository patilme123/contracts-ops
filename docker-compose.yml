services:
  postgres:
    image: postgres:16-alpine
    container_name: contract-console-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: contract_console
      POSTGRES_PASSWORD: contract_console
      POSTGRES_DB: contract_console
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U contract_console -d contract_console"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:
